# PielSana IA - despliegue en VPS (Contabo + DuckDNS)
# Uso: cp .env.example .env  (completar)  &&  docker compose up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pielsana-backend
    # Solo las variables que usa el backend (no recibe DUCKDNS_TOKEN ni el resto del .env).
    # Las vacías toman el valor por defecto del código.
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      RATE_LIMIT_IA: ${RATE_LIMIT_IA:-}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-}
    volumes:
      # Los modelos .keras no van en la imagen: se suben a la VPS con scp
      - ./backend/modelos:/app/backend/modelos
    restart: unless-stopped
    # GET / es el health del backend (la imagen slim no trae curl)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Sin puertos públicos: solo accesible desde Caddy por la red interna

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}
    container_name: pielsana-web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  duckdns:
    image: lscr.io/linuxserver/duckdns:8aabc87c-ls95  # = latest al 2026-11-01
    container_name: pielsana-duckdns
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      TZ: America/Argentina/Buenos_Aires
      LOG_FILE: "false"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
